<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NoteNest – Note Manager</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <div class="logo">📝 NoteNest</div>
      <input id="search" class="search" type="search" placeholder="Search your notes…" aria-label="Search notes">
      <div id="userBadge" class="user-badge" hidden>
        👤 <span id="userName">User</span>
        <button id="logoutBtn" class="btn ghost" style="padding:4px 10px;font-size:.8rem;border-radius:8px">Log out</button>
      </div>
      <button id="newBtn" class="btn">+ New note</button>
    </header>

    <aside>
      <h3>Notes</h3>
      <button class="nav active" data-view="all">All notes <span class="count" id="c-all">0</span></button>
      <button class="nav" data-view="pinned">Pinned <span class="count" id="c-pinned">0</span></button>
      <button class="nav" data-view="archive">Archive <span class="count" id="c-archive">0</span></button>
      <button class="nav" data-view="trash">Trash <span class="count" id="c-trash">0</span></button>

      <h3>Categories</h3>
      <div id="cats" class="cats-container"></div>

      <div class="side-actions">
        <button class="btn ghost" id="exportBtn">Export backup</button>
        <button class="btn ghost" id="importBtn">Import backup</button>
        <input type="file" id="importFile" accept="application/json" hidden>
      </div>
    </aside>

    <main>
      <div class="toolbar">
        <h2 id="title">All notes</h2>
        <div class="right">
          <button class="btn danger" id="emptyBtn" hidden>Empty trash</button>
          <label style="flex-direction:row;align-items:center;gap:8px">Sort
            <select id="sort">
              <option value="updated">Last edited</option>
              <option value="created">Newest first</option>
              <option value="title">Title A–Z</option>
            </select>
          </label>
        </div>
      </div>
      <div class="grid" id="grid"></div>
    </main>
  </div>

  <!-- Note Editor Dialog -->
  <div id="dlg" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
    <div class="modal-box">
      <form id="form" novalidate>
        <h2 id="dlgTitle">New note</h2>
        <label>Title <input type="text" id="fTitle" maxlength="80" placeholder="e.g. Physics homework"></label>
        <label>Note <textarea id="fBody" placeholder="Write something…"></textarea></label>
        <label>Category <input type="text" id="fCat" list="catList" maxlength="20" placeholder="e.g. Study, Ideas, Personal"></label>
        <datalist id="catList"></datalist>
        <div>
          <div style="font-weight:700;font-size:.9rem;margin-bottom:6px">Colour</div>
          <div class="swatches" id="swatches"></div>
        </div>
        <div class="form-foot">
          <span class="count" id="wc">0 words</span>
          <div>
            <button type="button" class="btn ghost" id="cancelBtn">Cancel</button>
            <button type="submit" class="btn" id="saveBtn">Save note</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Login & Register Modal -->
  <div id="authModal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="authTitle">
    <div class="auth-box">
      <div class="auth-logo">📝 NoteNest</div>
      <div id="authTitle" class="auth-subtitle">Sign in to sync your notes across devices</div>

      <div class="auth-tabs">
        <button type="button" class="auth-tab active" id="authLoginTab">Log In</button>
        <button type="button" class="auth-tab" id="authRegisterTab">Register</button>
      </div>

      <form id="authForm" novalidate>
        <div id="authNameGroup" hidden>
          <label>Your Name
            <input type="text" id="authName" placeholder="e.g. Alex Sharma" autocomplete="name">
          </label>
        </div>

        <label>Email Address
          <input type="email" id="authEmail" placeholder="e.g. student@college.edu" required autocomplete="email">
        </label>

        <label>Password
          <input type="password" id="authPassword" placeholder="Minimum 8 characters" required autocomplete="current-password">
        </label>

        <div id="authError" class="auth-error"></div>

        <button type="submit" class="btn" id="authSubmitBtn" style="width:100%;margin-top:10px">Sign In</button>
      </form>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="api.js"></script>
  <script src="script.js"></script>
</body>
</html>
